<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>M200 Bridge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Icons: one sprite, used as <svg class="ic"><use href="#i-name"/></svg>. Stroke icons, 24x24. -->
<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M19 12l-7 7-7-7"/></symbol>
  <symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
  <symbol id="i-right" viewBox="0 0 24 24"><path d="M5 12h14M12 5l7 7-7 7"/></symbol>
  <symbol id="i-z-up" viewBox="0 0 24 24"><path d="M6 11l6-6 6 6M6 18l6-6 6 6"/></symbol>
  <symbol id="i-z-down" viewBox="0 0 24 24"><path d="M6 6l6 6 6-6M6 13l6 6 6-6"/></symbol>
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7L20 8.5"/><path d="M20 3v5.5h-5.5"/></symbol>
  <symbol id="i-power" viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1 0 11.4 0"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><path d="M8.5 2h7L22 8.5v7L15.5 22h-7L2 15.5v-7z"/><path d="M8 12h8"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5l12 7.5-12 7.5z"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10 14M21 3l-7 18-4-7-7-4z"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></symbol>
  <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="1.5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></symbol>
  <symbol id="i-move" viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
  <symbol id="i-term" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3M13 15h4"/></symbol>
  <symbol id="i-printer" viewBox="0 0 24 24"><path d="M4 21V4h16v17M4 17h16M9 4v6h6V4M12 10v3"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></symbol>
  <symbol id="i-wifi" viewBox="0 0 24 24"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0M12 19.5h.01"/></symbol>
</svg>
<header class="top">
  <h1>M200</h1>
  <div class="dots">
    <span class="dot" id="dot-printer" title="printer link"><i></i><svg class="ic"><use href="#i-printer"/></svg>printer</span>
    <span class="dot" id="dot-ws" title="connection to the bridge"><i></i><svg class="ic"><use href="#i-link"/></svg>bridge</span>
    <span class="dot" id="dot-wifi" title="WiFi signal of the bridge"><i></i><svg class="ic"><use href="#i-wifi"/></svg><span id="rssi">wifi</span></span>
  </div>
  <button id="open-settings" class="gear" type="button" title="Setting tweaking" aria-label="Setting tweaking" aria-haspopup="dialog">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6a.5.5 0 0 0 .1-.6l-2-3.5a.5.5 0 0 0-.6-.2l-2.5 1a7.3 7.3 0 0 0-1.7-1l-.4-2.6a.5.5 0 0 0-.5-.4h-4a.5.5 0 0 0-.5.4l-.4 2.6a7.3 7.3 0 0 0-1.7 1l-2.5-1a.5.5 0 0 0-.6.2l-2 3.5a.5.5 0 0 0 .1.6L4.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6a.5.5 0 0 0-.1.6l2 3.5c.1.2.4.3.6.2l2.5-1c.5.4 1.1.7 1.7 1l.4 2.6c0 .2.2.4.5.4h4c.3 0 .5-.2.5-.4l.4-2.6a7.3 7.3 0 0 0 1.7-1l2.5 1c.2.1.5 0 .6-.2l2-3.5a.5.5 0 0 0-.1-.6L19.4 13zM12 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z"/></svg>
  </button>
  <button id="stop" class="stop" type="button"><svg class="ic"><use id="stop-icon" href="#i-stop"/></svg><span id="stop-label">STOP</span></button>
</header>

<main class="grid">
  <section class="card pos">
    <h2><svg class="ic"><use href="#i-target"/></svg>Position
      <span class="badges" title="Homed by the bridge: 0 = the switch, limits in Setting tweaking">
        <span class="badge" id="homed-x">X</span><span class="badge" id="homed-y">Y</span><span class="badge" id="homed-z">Z</span>
      </span>
      <button type="button" id="pos-refresh" class="icon-btn" title="Refresh the position (M114)" aria-label="Refresh the position"><svg class="ic"><use href="#i-refresh"/></svg></button>
    </h2>
    <div class="xyz">
      <div><small>X</small><span id="pos-x">--</span></div>
      <div><small>Y</small><span id="pos-y">--</span></div>
      <div><small>Z</small><span id="pos-z">--</span></div>
    </div>
    <!-- The real head position (last M114, sent after every jog / preset / home), like a preset frame -->
    <div class="live off" id="live">
      <div class="frame live-xy" id="live-xy" title="X Y from the last M114: 0 = the switches">
        <span class="dot-at" id="live-dot"></span><span class="lbl" id="live-lbl">Home X Y to see the head</span>
      </div>
      <div class="live-z" id="live-z" title="Z from the last M114: 0 = the switch"><i id="live-zmark"></i><small>Z</small></div>
    </div>
    <div class="row"><span class="muted" id="busy"></span></div>
  </section>

  <section class="card jog">
    <h2><svg class="ic"><use href="#i-move"/></svg>Move</h2>
    <div class="pad">
      <button type="button" data-jog="Y" data-dir="1" style="grid-area:yp"><svg class="ic"><use href="#i-up"/></svg><span>Y+</span></button>
      <button type="button" data-jog="X" data-dir="-1" style="grid-area:xm"><svg class="ic"><use href="#i-left"/></svg><span>X-</span></button>
      <button type="button" id="home" class="home" style="grid-area:hm" title="Home X Y on their endstops, then park off the switches (the bridge does it: G28 stops Marlin)" aria-label="Home X Y"><svg class="ic"><use href="#i-home"/></svg><span>XY</span></button>
      <button type="button" data-jog="X" data-dir="1" style="grid-area:xp"><svg class="ic"><use href="#i-right"/></svg><span>X+</span></button>
      <button type="button" data-jog="Y" data-dir="-1" style="grid-area:ym"><svg class="ic"><use href="#i-down"/></svg><span>Y-</span></button>
      <button type="button" data-jog="Z" data-dir="1" style="grid-area:zp"><svg class="ic"><use href="#i-z-up"/></svg><span>Z+</span></button>
      <button type="button" data-jog="Z" data-dir="-1" style="grid-area:zm"><svg class="ic"><use href="#i-z-down"/></svg><span>Z-</span></button>
      <button type="button" id="home-z" class="home" style="grid-area:zh" title="Home Z on the switch (seek steps, back off, fine steps), then park off the switch" aria-label="Home Z"><svg class="ic"><use href="#i-home"/></svg><span>Z</span></button>
    </div>
    <div class="steps" role="radiogroup" aria-label="Step size">
      <button type="button" data-step="0.1">0.1</button>
      <button type="button" data-step="1" class="on">1</button>
      <button type="button" data-step="10">10</button>
      <span class="muted">mm</span>
    </div>
    <label class="toggle free-move" title="Axes that aren't homed have no limits. Endstop switches are watched during the move (M120), but nothing stops an axis at the far end"><input type="checkbox" id="free-move"> move without homing <span class="muted">(no limits, can crash)</span></label>
    <div class="row"><span class="muted" id="jog-hint">Home first to move</span><button type="button" id="motors-off"><svg class="ic"><use href="#i-power"/></svg>Motors off</button></div>
  </section>

  <section class="card presets">
    <h2><svg class="ic"><use href="#i-grid"/></svg>Presets <span class="muted" id="preset-range">X Y, % of the travel</span></h2>
    <div class="frames" id="frames"></div>
    <div class="muted" id="preset-hint">Home X Y first</div>
  </section>

  <section class="card console">
    <h2><svg class="ic"><use href="#i-term"/></svg>Console
      <label class="toggle"><input type="checkbox" id="show-all"> show ok / reports</label>
    </h2>
    <div class="quick">
      <button type="button" data-cmd="M114">M114</button>
      <button type="button" data-cmd="M119">M119</button>
      <button type="button" data-cmd="M115">M115</button>
      <button type="button" data-cmd="M503">M503</button>
      <button type="button" id="clear" class="ghost"><svg class="ic"><use href="#i-trash"/></svg>clear</button>
    </div>
    <div id="log" class="log" aria-live="polite"></div>
    <form id="cmd" class="cmd">
      <input id="cmd-in" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="G-code, ↑/↓ for history" maxlength="96">
      <button type="submit"><svg class="ic"><use href="#i-send"/></svg>Send</button>
    </form>
  </section>
</main>
<dialog id="settings" class="sheet" aria-labelledby="settings-title">
  <form method="dialog" id="settings-form" novalidate>
    <div class="sheet-bar">
      <button type="button" class="bar-btn" id="settings-cancel">Cancel</button>
      <h3 id="settings-title" tabindex="-1" autofocus>Setting tweaking</h3>
      <button type="submit" class="bar-btn strong" id="settings-save">Save</button>
    </div>
    <div class="sheet-body" id="settings-body"></div>
  </form>
</dialog>
<script src="app.js"></script>
</body>
</html>
